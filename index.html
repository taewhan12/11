"왈\"],\n[\"往\",\"갈\",\"왕\"],\n[\"王\",\"임금\",\"왕\"],\n[\"外\",\"바깥\",\"외\"],\n[\"要\",\"중요할\",\"요\"],\n[\"欲\",\"하고자할\",\"욕\"],\n[\"浴\",\"목욕할\",\"욕\"],\n[\"勇\",\"날랠\",\"용\"],\n[\"容\",\"얼굴\",\"용\"],\n[\"用\",\"쓸\",\"용\"],\n[\"于\",\"어조사\",\"우\"],\n[\"又\",\"또\",\"우\"],\n[\"友\",\"벗\",\"우\"],\n[\"右\",\"오른\",\"우\"],\n[\"宇\",\"집\",\"우\"],\n[\"尤\",\"더욱\",\"우\"],\n[\"憂\",\"근심\",\"우\"],\n[\"牛\",\"소\",\"우\"],\n[\"遇\",\"만날\",\"우\"],\n[\"雨\",\"비\",\"우\"],\n[\"云\",\"말할\",\"운\"],\n[\"運\",\"옮길 / 운수\",\"운\"],\n[\"雲\",\"구름\",\"운\"],\n[\"雄\",\"수컷\",\"웅\"],\n[\"元\",\"으뜸\",\"원\"],\n[\"原\",\"근원\",\"원\"],\n[\"圓\",\"둥글\",\"원\"],\n[\"園\",\"동산\",\"원\"],\n[\"怨\",\"원망할\",\"원\"],\n[\"遠\",\"멀\",\"원\"],\n[\"願\",\"원할\",\"원\"],\n[\"月\",\"달\",\"월\"],\n[\"位\",\"자리\",\"위\"],\n[\"偉\",\"클\",\"위\"],\n[\"危\",\"위태로울\",\"위\"],\n[\"威\",\"위엄\",\"위\"],\n[\"爲\",\"할\",\"위\"],\n[\"唯\",\"오직\",\"유\"],\n[\"幼\",\"어릴\",\"유\"],\n[\"有\",\"있을\",\"유\"],\n[\"柔\",\"부드러울\",\"유\"],\n[\"油\",\"기름\",\"유\"],\n[\"猶\",\"오히려\",\"유\"],\n[\"由\",\"말미암을\",\"유\"],\n[\"遊\",\"놀\",\"유\"],\n[\"遺\",\"남길\",\"유\"],\n[\"酉\",\"열째지지\",\"유\"],\n[\"肉\",\"고기\",\"육\"],\n[\"育\",\"기를\",\"육\"],\n[\"恩\",\"은혜\",\"은\"],\n[\"銀\",\"은\",\"은\"],\n[\"乙\",\"둘째천간\",\"을\"],\n[\"吟\",\"읊을\",\"음\"],\n[\"陰\",\"그늘\",\"음\"],\n[\"音\",\"소리\",\"음\"],\n[\"飮\",\"마실\",\"음\"],\n[\"泣\",\"울\",\"읍\"],\n[\"邑\",\"고을\",\"읍\"],\n[\"應\",\"응할\",\"응\"],\n[\"依\",\"의지할\",\"의\"],\n[\"意\",\"뜻\",\"의\"],\n[\"矣\",\"어조사\",\"의\"],\n[\"義\",\"옳을 / 뜻\",\"의\"],\n[\"衣\",\"옷\",\"의\"],\n[\"議\",\"의논\",\"의\"],\n[\"醫\",\"의원\",\"의\"],\n[\"二\",\"둘\",\"이\"],\n[\"以\",\"써\",\"이\"],\n[\"已\",\"이미\",\"이\"]\n];\n\nconst $ = id => document.getElementById(id);\nconst SIZE = 10;\nconst totalRanges = Math.ceil(D.length / SIZE);\n\nlet selected = new Set(Array.from({length:totalRanges},(_,i)=>i));\nlet questions = [];\nlet pos = 0;\nlet results = [];\nlet graded = false;\nlet autoNextTimer = null;\n\n// 자동 이동 예약\nfunction scheduleAutoNext() {\n  clearTimeout(autoNextTimer);\n  autoNextTimer = null;\n\n  if ($(\"autoNext\").checked && graded) {\n    autoNextTimer = setTimeout(() => {\n      autoNextTimer = null;\n\n      if (graded) {\n        nextQuestion();\n      }\n    }, 700);\n  }\n}\n\n// 입력 답안 정리\nfunction norm(s) {\n  return s.toLowerCase()\n    .replace(/\\s+/g,\"\")\n    .replace(/[·ㆍ,，。.!！?？/／]/g,\"\");\n}\n\n// 정답 확인\nfunction matches(input, answer) {\n  const value = norm(input);\n  return answer.split(\"/\").some(part => norm(part) === value);\n}\n\n// 문제 순서 섞기\nfunction shuffleArray(a) {\n  for(let i=a.length-1;i>0;i--){\n    const j=Math.floor(Math.random()*(i+1));\n    [a[i],a[j]]=[a[j],a[i]];\n  }\n  return a;\n}\n\n// 시험 범위 표시\nfunction renderRanges() {\n  const root=$(\"ranges\");\n  root.replaceChildren();\n\n  for(let i=0;i<totalRanges;i++){\n    const start=i*SIZE+1;\n    const end=Math.min((i+1)*SIZE,D.length);\n\n    const label=document.createElement(\"label\");\n    label.className=\"range\";\n\n    const cb=document.createElement(\"input\");\n    cb.type=\"checkbox\";\n    cb.checked=selected.has(i);\n\n    const txt=document.createElement(\"span\");\n\n    const strong=document.createElement(\"strong\");\n    strong.textContent=`${start}–${end}번`;\n\n    const small=document.createElement(\"small\");\n    small.textContent=`${end-start+1}개`;\n\n    txt.append(strong,small);\n    label.append(cb,txt);\n    root.append(label);\n\n    cb.addEventListener(\"change\",()=>{\n      cb.checked ? selected.add(i) : selected.delete(i);\n      updateCount();\n    });\n  }\n\n  updateCount();\n}\n\n// 선택한 문제 수 표시\nfunction updateCount(){\n  let n=0;\n\n  selected.forEach(i=>{\n    n+=Math.min(SIZE,D.length-i*SIZE);\n  });\n\n  $(\"selectedCount\").textContent=`${selected.size}개 범위 · ${n}자`;\n  $(\"start\").disabled=n===0;\n}\n\n// 시험 시작\nfunction begin(items) {\n  clearTimeout(autoNextTimer);\n  autoNextTimer = null;\n\n  questions=items.slice();\n\n  if($(\"shuffle\").checked){\n    shuffleArray(questions);\n  }\n\n  pos=0;\n  results=[];\n  graded=false;\n\n  $(\"setup\").classList.add(\"hidden\");\n  $(\"result\").classList.add(\"hidden\");\n  $(\"exam\").classList.remove(\"hidden\");\n\n  // 화면이 바뀌어도 자동 이동 설정 유지\n  $(\"autoNextExam\").checked=$(\"autoNext\").checked;\n\n  showQuestion();\n}\n\n// 선택한 범위로 문제 만들기\nfunction startExam(){\n  const items=[];\n\n  [...selected].sort((a,b)=>a-b).forEach(r=>{\n    for(let i=r*SIZE;i<Math.min((r+1)*SIZE,D.length);i++){\n      items.push({\n        d:D[i],\n        idx:i,\n        range:r\n      });\n    }\n  });\n\n  begin(items);\n}\n\n// 문제 표시\nfunction showQuestion(){\n  const q=questions[pos];\n\n  graded=false;\n\n  clearTimeout(autoNextTimer);\n  autoNextTimer=null;\n\n  $(\"counter\").textContent=`${pos+1} / ${questions.length}`;\n  $(\"number\").textContent=`문제 ${pos+1}`;\n  $(\"bar\").style.width=`${(pos+1)/questions.length*100}%`;\n  $(\"hanja\").textContent=q.d[0];\n\n  $(\"meaning\").value=\"\";\n  $(\"sound\").value=\"\";\n  $(\"meaning\").disabled=false;\n  $(\"sound\").disabled=false;\n\n  $(\"feedback\").className=\"hidden\";\n  $(\"feedback\").textContent=\"\";\n\n  $(\"after\").classList.add(\"hidden\");\n  $(\"submit\").classList.remove(\"hidden\");\n\n  $(\"rangeInfo\").textContent=\n    `원래 범위 ${q.range*SIZE+1}–${Math.min((q.range+1)*SIZE,D.length)}번`;\n\n  $(\"remaining\").textContent=`남은 문제 ${questions.length-pos-1}개`;\n\n  $(\"meaning\").focus();\n}\n\n// 답안 제출 및 채점\n$(\"form\").addEventListener(\"submit\",e=>{\n  e.preventDefault();\n\n  if(graded)return;\n\n  const q=questions[pos];\n  const userMeaning=$(\"meaning\").value.trim();\n  const userSound=$(\"sound\").value.trim();\n\n  if(!userMeaning||!userSound){\n    alert(\"뜻과 음을 모두 입력해 주세요.\");\n    return;\n  }\n\n  const meaningOK=matches(userMeaning,q.d[1]);\n  const soundOK=matches(userSound,q.d[2]);\n  const correct=meaningOK&&soundOK;\n\n  results.push({\n    q,\n    userMeaning,\n    userSound,\n    meaningOK,\n    soundOK,\n    correct\n  });\n\n  graded=true;\n\n  $(\"meaning\").disabled=true;\n  $(\"sound\").disabled=true;\n  $(\"submit\").classList.add(\"hidden\");\n\n  const fb=$(\"feedback\");\n  fb.className=\"feedback \"+(correct?\"correct\":\"incorrect\");\n  fb.innerHTML=\"\";\n\n  const title=document.createElement(\"strong\");\n  title.textContent=correct?\"정답입니다!\":\"오답입니다.\";\n\n  fb.append(title,document.createElement(\"br\"));\n\n  const line1=document.createElement(\"span\");\n  line1.textContent=\n    `뜻: ${q.d[1]} — ${meaningOK?\"정답\":\"입력: \"+userMeaning}`;\n\n  const line2=document.createElement(\"span\");\n  line2.textContent=\n    `음: ${q.d[2]} — ${soundOK?\"정답\":\"입력: \"+userSound}`;\n\n  fb.append(\n    line1,\n    document.createElement(\"br\"),\n    line2\n  );\n\n  $(\"after\").classList.remove(\"hidden\");\n\n  $(\"next\").textContent=\n    pos===questions.length-1 ? \"결과 보기\" : \"다음 문제 →\";\n\n  // 자동 이동이 켜져 있으면 0.7초 뒤 다음 문제로 이동\n  scheduleAutoNext();\n});\n\n// 다음 문제\nfunction nextQuestion(){\n  clearTimeout(autoNextTimer);\n  autoNextTimer=null;\n\n  if(!graded)return;\n\n  if(pos<questions.length-1){\n    pos++;\n    showQuestion();\n  } else {\n    showResults();\n  }\n}\n\n// 처음 화면과 시험 중 화면의 체크박스 동기화\nfunction setAutoNext(enabled) {\n  $(\"autoNext\").checked=enabled;\n  $(\"autoNextExam\").checked=enabled;\n\n  clearTimeout(autoNextTimer);\n  autoNextTimer=null;\n\n  // 채점이 끝난 상태에서 켜면 타이머 시작\n  if(enabled && graded){\n    scheduleAutoNext();\n  }\n}\n\n// 처음 화면 체크박스 변경\n$(\"autoNext\").addEventListener(\"change\",()=>{\n  setAutoNext($(\"autoNext\").checked);\n});\n\n// 시험 중 화면 체크박스 변경\n$(\"autoNextExam\").addEventListener(\"change\",()=>{\n  setAutoNext($(\"autoNextExam\").checked);\n});\n\n// 결과 화면 표시\nfunction showResults(){\n  clearTimeout(autoNextTimer);\n  autoNextTimer=null;\n\n  $(\"exam\").classList.add(\"hidden\");\n  $(\"result\").classList.remove(\"hidden\");\n\n  const correct=results.filter(r=>r.correct).length;\n\n  $(\"score\").textContent=`${correct} / ${results.length} 정답`;\n\n  $(\"scoreDetail\").textContent=\n    `정답률 ${Math.round(correct/results.length*100)}% · 오답 ${results.length-correct}개`;\n\n  const root=$(\"review\");\n  root.replaceChildren();\n\n  results.forEach((r,i)=>{\n    const row=document.createElement(\"div\");\n    row.className=\"answerrow\";\n\n    const left=document.createElement(\"div\");\n\n    const title=document.createElement(\"strong\");\n    title.textContent=`${i+1}. ${r.q.d[0]} ${r.correct?\"✓\":\"✗\"}`;\n\n    const detail=document.createElement(\"div\");\n    detail.className=\"muted\";\n    detail.textContent=`입력: ${r.userMeaning} / ${r.userSound}`;\n\n    left.append(title,detail);\n\n    const right=document.createElement(\"div\");\n    right.className=\"muted\";\n    right.style.textAlign=\"right\";\n    right.textContent=`${r.q.d[1]} / ${r.q.d[2]}`;\n\n    row.append(left,right);\n    root.append(row);\n  });\n\n  $(\"wrongOnly\").disabled=correct===results.length;\n}\n\n// 범위 선택 화면으로 돌아가기\nfunction goHome(){\n  clearTimeout(autoNextTimer);\n  autoNextTimer=null;\n\n  $(\"exam\").classList.add(\"hidden\");\n  $(\"result\").classList.add(\"hidden\");\n  $(\"setup\").classList.remove(\"hidden\");\n\n  renderRanges();\n}\n\n// 버튼 이벤트\n$(\"all\").onclick=()=>{\n  selected=new Set(Array.from({length:totalRanges},(_,i)=>i));\n  renderRanges();\n};\n\n$(\"none\").onclick=()=>{\n  selected.clear();\n  renderRanges();\n};\n\n$(\"start\").onclick=startExam;\n$(\"back\").onclick=goHome;\n$(\"next\").onclick=nextQuestion;\n$(\"home\").onclick=goHome;\n\n// 전체 다시 풀기\n$(\"retry\").onclick=()=>{\n  begin(questions);\n};\n\n// 틀린 문제만 다시 풀기\n$(\"wrongOnly\").onclick=()=>{\n  begin(results.filter(r=>!r.correct).map(r=>r.q));\n};\n\n// 최초 범위 표시\nrenderRanges();\n<\/script>\n</body>\n</html>\n";
const writtenHTML="\n<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>주관식 시험 (100자)</title>\n<style>\n:root {\n  --bg: #f5f7fb;\n  --card: #ffffff;\n  --text: #20283a;\n  --muted: #727d91;\n  --line: #e0e5ee;\n  --accent: #4263eb;\n  --accent-light: #edf1ff;\n}\n* { box-sizing: border-box; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--text);\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\",\n    \"Noto Sans KR\", sans-serif;\n}\nbutton, input { font: inherit; }\nbutton { cursor: pointer; }\nbutton:focus-visible, input:focus-visible {\n  outline: 3px solid #9aafff;\n  outline-offset: 2px;\n}\n.container {\n  width: min(100% - 28px, 760px);\n  margin: 0 auto;\n  padding: 30px 0 50px;\n}\nheader { margin-bottom: 22px; }\n.eyebrow {\n  color: var(--accent);\n  font-size: 12px;\n  font-weight: 800;\n  letter-spacing: 2px;\n}\nh1 { font-size: 28px; margin: 7px 0; }\n.subtitle { color: var(--muted); font-size: 14px; line-height: 1.7; }\n.panel {\n  background: var(--card);\n  border: 1px solid var(--line);\n  border-radius: 18px;\n  padding: 22px;\n  margin-bottom: 16px;\n}\nh2 { font-size: 19px; margin: 0 0 8px; }\n.muted { color: var(--muted); }\n.small { font-size: 13px; line-height: 1.65; }\n.toolbar {\n  display: flex;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 9px;\n  margin: 18px 0;\n}\n.toolbar .summary { margin-left: auto; font-size: 13px; color: var(--muted); }\n.btn {\n  border: 1px solid var(--line);\n  background: white;\n  color: var(--text);\n  border-radius: 10px;\n  padding: 11px 15px;\n  font-weight: 650;\n}\n.btn.primary {\n  color: white;\n  background: var(--accent);\n  border-color: var(--accent);\n}\n.btn:disabled { opacity: .45; cursor: not-allowed; }\n.btn.full { width: 100%; padding: 15px; }\n.ranges {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 9px;\n  margin-bottom: 20px;\n}\n.range {\n  border: 1px solid var(--line);\n  border-radius: 12px;\n  padding: 12px;\n  display: flex;\n  align-items: center;\n  gap: 9px;\n  cursor: pointer;\n  min-width: 0;\n}\n.range:has(input:checked) {\n  border-color: var(--accent);\n  background: var(--accent-light);\n}\n.range input { accent-color: var(--accent); width: 17px; height: 17px; }\n.range strong { display: block; font-size: 14px; }\n.range small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }\n.setting {\n  display: flex;\n  gap: 9px;\n  align-items: center;\n  font-size: 14px;\n  margin: 15px 0 20px;\n}\n.setting input { width: 17px; height: 17px; accent-color: var(--accent); }\nhr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }\n.hidden { display: none !important; }\n.exam-top {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  margin-bottom: 18px;\n}\n.progress {\n  height: 7px;\n  background: var(--line);\n  border-radius: 10px;\n  overflow: hidden;\n  margin-bottom: 18px;\n}\n.progress-bar {\n  height: 100%;\n  width: 0;\n  background: var(--accent);\n  transition: width .2s;\n}\n.question {\n  text-align: center;\n  padding: 36px 20px;\n}\n.question-number {\n  color: var(--muted);\n  font-size: 13px;\n  font-weight: 700;\n  margin-bottom: 30px;\n}\n.label { font-size: 13px; color: var(--muted); margin-bottom: 12px; }\n.meaning {\n  font-size: clamp(27px, 6vw, 38px);\n  font-weight: 750;\n  line-height: 1.5;\n  overflow-wrap: anywhere;\n}\n.sound { font-size: 22px; color: var(--muted); margin-top: 10px; }\n.answer {\n  border-top: 1px solid var(--line);\n  margin-top: 30px;\n  padding-top: 25px;\n}\n.hanja {\n  font-size: clamp(70px, 16vw, 100px);\n  font-weight: 750;\n  line-height: 1.35;\n}\n.answer-detail { color: var(--muted); font-size: 14px; margin-top: 8px; }\n.actions { display: flex; gap: 10px; margin-top: 26px; }\n.actions .btn { flex: 1; padding: 14px 8px; }\n.exam-footer {\n  display: flex;\n  justify-content: space-between;\n  gap: 12px;\n  margin-top: 15px;\n  font-size: 12px;\n  color: var(--muted);\n}\n.done { text-align: center; padding: 38px 20px; }\n.done-icon { font-size: 42px; color: var(--accent); margin-bottom: 10px; }\n.done h2 { font-size: 26px; margin-bottom: 12px; }\n.done .btn { margin-top: 12px; }\n@media (max-width: 500px) {\n  .container { width: min(100% - 20px, 760px); padding-top: 22px; }\n  h1 { font-size: 25px; }\n  .panel { padding: 17px; }\n  .ranges { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }\n  .range { padding: 10px 8px; }\n  .question { padding: 30px 12px; }\n  .toolbar .summary { width: 100%; margin-left: 0; }\n}\n</style>\n\n<style id=\"range-visibility-fix\">\n/* 범위 선택 영역을 항상 명확하게 표시 */\n#setup:not(.hidden) { display: block !important; }\n#setup .ranges { display: grid !important; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; min-height: 40px; margin-top: 12px; }\n#setup .range { display: flex !important; visibility: visible !important; align-items: center; gap: 8px; min-height: 48px; padding: 10px; border: 1px solid var(--line, #dfe4ee); border-radius: 10px; background: #fff; color: var(--text, #20283a); cursor: pointer; }\n#setup .range input { display: inline-block !important; visibility: visible !important; flex: 0 0 auto; width: 17px; height: 17px; }\n#setup .range:has(input:checked) { border-color: var(--blue, #4263eb); background: #edf1ff; }\n#setup .range strong, #setup .range small { display: block !important; visibility: visible !important; }\n@media (max-width: 480px) { #setup .ranges { grid-template-columns: repeat(2, minmax(0, 1fr)); } }\n</style>\n</head>\n<body>\n<main class=\"container\">\n  <header>\n    <div class=\"eyebrow\">HANJA STUDY</div>\n    <h1>주관식 시험 (100자)</h1>\n    <div class=\"subtitle\">\n      뜻과 음을 보고 한자를 떠올려 보세요.<br>\n      정답을 확인한 후 다음 문제로 넘어갈 수 있습니다.\n    </div>\n  </header>\n\n  <section id=\"setup\">\n    <div class=\"panel\">\n      <h2>시험 범위 선택</h2>\n      <p class=\"subtitle\">원하는 범위를 여러 개 선택하세요.</p>\n\n      <div class=\"toolbar\">\n        <button class=\"btn\" id=\"selectAll\">전체 선택</button>\n        <button class=\"btn\" id=\"clearAll\">선택 해제</button>\n        <span class=\"summary\" id=\"selectedCount\"></span>\n      </div>\n\n      <div class=\"ranges\" id=\"ranges\"></div>\n\n      <hr>\n      <label class=\"setting\">\n        <input type=\"checkbox\" id=\"shuffle\" checked>\n        문제 순서를 무작위로 섞기\n      </label>\n\n      <button class=\"btn primary full\" id=\"startBtn\">시험 시작</button>\n      <p class=\"small muted\" id=\"setupMessage\"></p>\n    </div>\n\n    <div class=\"panel\">\n      <h2>시험 방법</h2>\n      <p class=\"small muted\">\n        1. 화면에 표시된 뜻과 음을 확인합니다.<br>\n        2. 정답을 생각한 뒤 '정답 확인'을 누릅니다.<br>\n        3. 정답 한자를 확인하고 '다음 문제'를 누릅니다.<br>\n        4. 마지막 문제까지 풀면 시험이 완료됩니다.\n      </p>\n    </div>\n  </section>\n\n  <section id=\"exam\" class=\"hidden\">\n    <div class=\"exam-top\">\n      <button class=\"btn\" id=\"backBtn\">← 범위 선택</button>\n      <span class=\"small muted\" id=\"counter\"></span>\n    </div>\n\n    <div class=\"progress\"><div class=\"progress-bar\" id=\"progressBar\"></div></div>\n\n    <div class=\"panel question\">\n      <div class=\"question-number\" id=\"questionNumber\"></div>\n      <div class=\"label\">뜻</div>\n      <div class=\"meaning\" id=\"meaning\"></div>\n      <div class=\"label\" style=\"margin-top:20px\">음</div>\n      <div class=\"sound\" id=\"sound\"></div>\n\n      <div class=\"answer hidden\" id=\"answerArea\">\n        <div class=\"label\">정답 한자</div>\n        <div class=\"hanja\" id=\"answer\"></div>\n        <div class=\"answer-detail\" id=\"answerDetail\"></div>\n      </div>\n\n      <div class=\"actions\">\n        <button class=\"btn primary\" id=\"revealBtn\">정답 확인</button>\n        <button class=\"btn hidden\" id=\"nextBtn\">다음 문제 →</button>\n      </div>\n    </div>\n\n    <div class=\"exam-footer\">\n      <span id=\"rangeInfo\"></span>\n      <span id=\"remaining\"></span>\n    </div>\n  </section>\n\n  <section id=\"complete\" class=\"hidden\">\n    <div class=\"panel done\">\n      <div class=\"done-icon\">✓</div>\n      <h2>시험 완료!</h2>\n      <p class=\"subtitle\">선택한 범위의 모든 문제를 확인했습니다.</p>\n      <p id=\"result\"></p>\n      <button class=\"btn primary full\" id=\"retryBtn\">같은 범위 다시 시험</button>\n      <button class=\"btn full\" id=\"homeBtn\">범위 다시 선택</button>\n    </div>\n  </section>\n</main>\n\n<script>\n// 한자 데이터: [한자, 뜻, 음]\nconst hanja = [\n  [\"主\",\"주인\",\"주\"],\n  [\"住\",\"살\",\"주\"],\n  [\"宙\",\"집\",\"주\"],\n  [\"晝\",\"낮\",\"주\"],\n  [\"朱\",\"붉을\",\"주\"],\n  [\"注\",\"물 댈\",\"주\"],\n  [\"走\",\"달릴\",\"주\"],\n  [\"酒\",\"술\",\"주\"],\n  [\"竹\",\"대나무\",\"죽\"],\n  [\"中\",\"가운데\",\"중\"],\n\n  [\"眾\",\"무리\",\"중\"],\n  [\"重\",\"무거울\",\"중\"],\n  [\"卽\",\"곧\",\"즉\"],\n  [\"增\",\"더할\",\"증\"],\n  [\"曾\",\"일찍\",\"증\"],\n  [\"證\",\"증거\",\"증\"],\n  [\"之\",\"갈 지 / 어조사 지\",\"지\"],\n  [\"只\",\"다만\",\"지\"],\n  [\"地\",\"땅\",\"지\"],\n  [\"志\",\"뜻\",\"지\"],\n\n  [\"持\",\"가질\",\"지\"],\n  [\"指\",\"가리킬\",\"지\"],\n  [\"支\",\"지탱할 지 / 지지 지\",\"지\"],\n  [\"枝\",\"가지\",\"지\"],\n  [\"止\",\"그칠\",\"지\"],\n  [\"知\",\"알다\",\"지\"],\n  [\"紙\",\"종이\",\"지\"],\n  [\"至\",\"이를\",\"지\"],\n  [\"直\",\"곧을\",\"직\"],\n  [\"盡\",\"다할\",\"진\"],\n\n  [\"眞\",\"참\",\"진\"],\n  [\"辰\",\"다섯째지지 진 / 별 신\",\"진 / 신\"],\n  [\"進\",\"나아갈\",\"진\"],\n  [\"質\",\"바탕\",\"질\"],\n  [\"執\",\"잡을\",\"집\"],\n  [\"集\",\"모을\",\"집\"],\n  [\"且\",\"또\",\"차\"],\n  [\"借\",\"빌릴\",\"차\"],\n  [\"次\",\"버금\",\"차\"],\n  [\"此\",\"이\",\"차\"],\n\n  [\"着\",\"붙을\",\"착\"],\n  [\"察\",\"살필\",\"찰\"],\n  [\"參\",\"참여할\",\"참\"],\n  [\"唱\",\"부를\",\"창\"],\n  [\"昌\",\"창성할\",\"창\"],\n  [\"窓\",\"창문\",\"창\"],\n  [\"採\",\"캘\",\"채\"],\n  [\"菜\",\"나물\",\"채\"],\n  [\"冊\",\"책\",\"책\"],\n  [\"責\",\"꾸짖을\",\"책\"],\n\n  [\"妻\",\"아내\",\"처\"],\n  [\"處\",\"곳\",\"처\"],\n  [\"尺\",\"자\",\"척\"],\n  [\"千\",\"일천\",\"천\"],\n  [\"天\",\"하늘\",\"천\"],\n  [\"川\",\"내\",\"천\"],\n  [\"泉\",\"샘\",\"천\"],\n  [\"淺\",\"얕을\",\"천\"],\n  [\"鐵\",\"쇠\",\"철\"],\n  [\"晴\",\"갰\",\"청\"],\n\n  [\"淸\",\"맑을\",\"청\"],\n  [\"聽\",\"들을\",\"청\"],\n  [\"請\",\"청할\",\"청\"],\n  [\"靑\",\"푸를\",\"청\"],\n  [\"體\",\"몸\",\"체\"],\n  [\"初\",\"처음\",\"초\"],\n  [\"招\",\"부를\",\"초\"],\n  [\"草\",\"풀\",\"초\"],\n  [\"寸\",\"마디\",\"촌\"],\n  [\"村\",\"마을\",\"촌\"],\n\n  [\"最\",\"가장\",\"최\"],\n  [\"推\",\"밀다\",\"추\"],\n  [\"秋\",\"가을\",\"추\"],\n  [\"追\",\"쫓을\",\"추\"],\n  [\"丑\",\"둘째지지\",\"축\"],\n  [\"祝\",\"빌\",\"축\"],\n  [\"春\",\"봄\",\"춘\"],\n  [\"出\",\"나갈\",\"출\"],\n  [\"充\",\"찰\",\"충\"],\n  [\"忠\",\"충성\",\"충\"],\n\n  [\"蟲\",\"벌레\",\"충\"],\n  [\"取\",\"가질\",\"취\"],\n  [\"吹\",\"불다\",\"취\"],\n  [\"就\",\"나아갈\",\"취\"],\n  [\"治\",\"다스릴\",\"치\"],\n  [\"致\",\"이를\",\"치\"],\n  [\"齒\",\"이\",\"치\"],\n  [\"則\",\"법칙\",\"칙\"],\n  [\"親\",\"친할\",\"친\"],\n  [\"七\",\"일곱\",\"칠\"],\n\n  [\"針\",\"바늘\",\"침\"],\n  [\"快\",\"상쾌할\",\"쾌\"],\n  [\"他\",\"다를 타 / 남 타\",\"타\"],\n  [\"打\",\"칠\",\"타\"],\n  [\"脫\",\"벗을\",\"탈\"],\n  [\"探\",\"찾을\",\"탐\"],\n  [\"太\",\"클\",\"태\"],\n  [\"泰\",\"클\",\"태\"],\n  [\"宅\",\"집\",\"택\"],\n  [\"土\",\"흙\",\"토\"]\n];\n\nconst $ = id => document.getElementById(id);\nconst SIZE = 10;\nconst rangeCount = Math.ceil(hanja.length / SIZE);\n\nlet selectedRanges = new Set(\n  Array.from({length: rangeCount}, (_, i) => i)\n);\nlet questions = [];\nlet current = 0;\nlet revealed = false;\n\nfunction renderRanges() {\n  const root = $(\"ranges\");\n  root.replaceChildren();\n\n  for (let i = 0; i < rangeCount; i++) {\n    const start = i * SIZE + 1;\n    const end = Math.min((i + 1) * SIZE, hanja.length);\n    const label = document.createElement(\"label\");\n    label.className = \"range\";\n\n    const checkbox = document.createElement(\"input\");\n    checkbox.type = \"checkbox\";\n    checkbox.checked = selectedRanges.has(i);\n\n    const text = document.createElement(\"span\");\n    const title = document.createElement(\"strong\");\n    title.textContent = `${start}–${end}번`;\n\n    const detail = document.createElement(\"small\");\n    detail.textContent = `${end - start + 1}개 한자`;\n\n    text.append(title, detail);\n    label.append(checkbox, text);\n    root.append(label);\n\n    checkbox.addEventListener(\"change\", () => {\n      if (checkbox.checked) selectedRanges.add(i);\n      else selectedRanges.delete(i);\n      updateSelection();\n    });\n  }\n\n  updateSelection();\n}\n\nfunction updateSelection() {\n  let count = 0;\n  for (const i of selectedRanges) {\n    count += Math.min(SIZE, hanja.length - i * SIZE);\n  }\n\n  $(\"selectedCount\").textContent =\n    `${selectedRanges.size}개 범위 · ${count}자 선택`;\n\n  $(\"startBtn\").disabled = count === 0;\n  $(\"setupMessage\").textContent = count === 0\n    ? \"시험을 시작하려면 범위를 하나 이상 선택하세요.\"\n    : \"\";\n}\n\nfunction shuffleArray(array) {\n  for (let i = array.length - 1; i > 0; i--) {\n    const j = Math.floor(Math.random() * (i + 1));\n    [array[i], array[j]] = [array[j], array[i]];\n  }\n  return array;\n}\n\nfunction startExam() {\n  questions = [];\n\n  [...selectedRanges]\n    .sort((a, b) => a - b)\n    .forEach(range => {\n      const start = range * SIZE;\n      const end = Math.min(start + SIZE, hanja.length);\n\n      for (let i = start; i < end; i++) {\n        questions.push({\n          data: hanja[i],\n          originalIndex: i,\n          range: range\n        });\n      }\n    });\n\n  if ($(\"shuffle\").checked) {\n    shuffleArray(questions);\n  }\n\n  current = 0;\n  $(\"setup\").classList.add(\"hidden\");\n  $(\"complete\").classList.add(\"hidden\");\n  $(\"exam\").classList.remove(\"hidden\");\n  showQuestion();\n}\n\nfunction showQuestion() {\n  const q = questions[current];\n  const [character, meaning, sound] = q.data;\n\n  revealed = false;\n\n  $(\"counter\").textContent =\n    `${current + 1} / ${questions.length}`;\n\n  $(\"questionNumber\").textContent =\n    `QUESTION ${String(current + 1).padStart(2, \"0\")}`;\n\n  $(\"progressBar\").style.width =\n    `${((current + 1) / questions.length) * 100}%`;\n\n  $(\"meaning\").textContent = meaning;\n  $(\"sound\").textContent = sound;\n\n  $(\"answer\").textContent = character;\n  $(\"answerDetail\").textContent =\n    `뜻: ${meaning} · 음: ${sound}`;\n\n  $(\"answerArea\").classList.add(\"hidden\");\n  $(\"revealBtn\").classList.remove(\"hidden\");\n  $(\"nextBtn\").classList.add(\"hidden\");\n\n  $(\"nextBtn\").textContent =\n    current === questions.length - 1\n      ? \"시험 완료\"\n      : \"다음 문제 →\";\n\n  const start = q.range * SIZE + 1;\n  const end = Math.min((q.range + 1) * SIZE, hanja.length);\n\n  $(\"rangeInfo\").textContent =\n    `원래 범위: ${start}–${end}번`;\n\n  $(\"remaining\").textContent =\n    `남은 문제 ${questions.length - current - 1}개`;\n}\n\nfunction revealAnswer() {\n  if (revealed) return;\n  revealed = true;\n\n  $(\"answerArea\").classList.remove(\"hidden\");\n  $(\"revealBtn\").classList.add(\"hidden\");\n  $(\"nextBtn\").classList.remove(\"hidden\");\n}\n\nfunction nextQuestion() {\n  if (!revealed) return;\n\n  if (current < questions.length - 1) {\n    current++;\n    showQuestion();\n  } else {\n    finishExam();\n  }\n}\n\nfunction finishExam() {\n  $(\"exam\").classList.add(\"hidden\");\n  $(\"complete\").classList.remove(\"hidden\");\n  $(\"result\").textContent =\n    `${questions.length}개 문제를 모두 확인했습니다.`;\n}\n\nfunction goHome() {\n  $(\"exam\").classList.add(\"hidden\");\n  $(\"complete\").classList.add(\"hidden\");\n  $(\"setup\").classList.remove(\"hidden\");\n  renderRanges();\n}\n\n$(\"selectAll\").addEventListener(\"click\", () => {\n  selectedRanges = new Set(\n    Array.from({length: rangeCount}, (_, i) => i)\n  );\n  renderRanges();\n});\n\n$(\"clearAll\").addEventListener(\"click\", () => {\n  selectedRanges.clear();\n  renderRanges();\n});\n\n$(\"startBtn\").addEventListener(\"click\", startExam);\n$(\"revealBtn\").addEventListener(\"click\", revealAnswer);\n$(\"nextBtn\").addEventListener(\"click\", nextQuestion);\n$(\"backBtn\").addEventListener(\"click\", goHome);\n$(\"homeBtn\").addEventListener(\"click\", goHome);\n$(\"retryBtn\").addEventListener(\"click\", startExam);\n\nrenderRanges();\n<\/script>\n</body>\n</html>";
